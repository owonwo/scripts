name: Release

on:
  push:
    branches:
      - main
      - chore/merge-crag-workflow

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install

      - name: Ensure vite for builds
        run: pnpm add -wD vite@^8.2.1 --save-dev || true

      - run: pnpm -r --filter '!@wigxel/env-cleaner' run build

      - run: pnpm -r --filter '!@wigxel/env-cleaner' run test

      - name: Validate example apps
        run: pnpm --filter @wigxel/crag run validate

      - name: Run react-tf demo
        run: pnpm --filter @wigxel/react-tf run demo

      - name: Run react-tf-oxc demo
        run: pnpm --filter @wigxel/react-tf-oxc run demo

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install

      - name: Create .npmrc
        run: |
          cat << EOF > ".npmrc"
          //registry.npmjs.org/:_authToken=\${{ secrets.NPM_TOKEN }}
          EOF

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.WIGXEL_GITHUB_PACKAGE_TOKEN }}
          NPM_TOKEN: ${{ secrets.WIGXEL_NPM_TOKEN }}
